<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Portal - Sasya Farmer Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f0fdf4; font-family: sans-serif; padding: 20px;">

    <div style="max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 2px solid #86efac;">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="color: #14532d; margin: 0;">🧑‍🌾 రైతు రిజిస్ట్రేషన్ ఫారం / Farmer Portal</h2>
            <p style="color: #166534; font-size: 14px; margin: 5px 0 0 0;">మీ వద్ద ఉన్న తాజా పంట వివరాలను మరియు ఫోటోలను ఇక్కడ నమోదు చేయండి</p>
        </div>

        <form id="farmer-form" onsubmit="submitFarmerData(event)">
            
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; color: #14532d; font-size: 14px;">రైతు పేరు (Farmer Name):</label>
                <input type="text" id="farmer-name" required placeholder="ఉదా: రామయ్య" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; color: #14532d; font-size: 14px;">ఫోన్ నంబర్ (Phone Number):</label>
                <input type="tel" id="farmer-phone" required placeholder="10 అంకెల మొబైల్ నంబర్" pattern="[0-9]{10}" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; color: #14532d; font-size: 14px;">గ్రామం / ఊరు (Village/Location):</label>
                <input type="text" id="farmer-location" required placeholder="ఉదా: తిరుపతి సమీపంలో" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
            </div>

            <hr style="border: 0; border-top: 2px dashed #bbf7d0; margin: 20px 0;">

            <h3 style="color: #14532d; font-size: 16px; margin-bottom: 10px;">🌾 పంటల వివరాలు (Products List)</h3>
            
            <div id="products-container"></div>

            <button type="button" onclick="addProductRow()" style="background: #e0f2fe; color: #0369a1; border: 1px dashed #0ea5e9; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 20px;">
                ➕ మరో పంటను జోడించండి (Add Another Product)
            </button>

            <button type="submit" style="background: #166534; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
                📤 వివరాలను అడ్మిన్‌కి పంపండి (Send to Admin)
            </button>

        </form>
    </div>

    <!-- 📷 లైవ్ వెబ్‌క్యామ్ మోడల్ -->
    <div id="webcam-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:20px; border-radius:10px; text-align:center; max-width:400px; width:100%;">
            <h3 style="margin-top:0; color:#14532d;">📸 లైవ్ ఫోటో క్యాప్చర్</h3>
            <video id="webcam-video" autoplay playsinline style="width:100%; border-radius:8px; background:#000; max-height:250px; object-fit:cover;"></video>
            <canvas id="webcam-canvas" style="display:none;"></canvas>
            <div style="margin-top:15px; display:flex; justify-content:space-between; gap:10px;">
                <button type="button" onclick="captureSnapshot()" style="background:#166534; color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; font-weight:bold; flex:1;">📷 ఫోటో తీయండి</button>
                <button type="button" onclick="closeWebcamModal()" style="background:#fee2e2; color:#991b1b; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; font-weight:bold; flex:1;">❌ రద్దు చేయండి</button>
            </div>
        </div>
    </div>

    <script>
        let activeImageInput = null;
        let videoStream = null;

        document.addEventListener("DOMContentLoaded", function () {
            addProductRow();
        });

        function addProductRow() {
            const container = document.getElementById("products-container");
            const rowIndex = container.children.length + 1;

            const rowDiv = document.createElement("div");
            rowDiv.className = "product-item-row";
            rowDiv.style.cssText = "background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative;";

            rowDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-weight: bold; color: #334155; font-size: 13px;">పంట #${rowIndex}</span>
                    ${rowIndex > 1 ? '<button type="button" onclick="this.parentElement.parentElement.remove()" style="background: #fee2e2; color: #991b1b; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">తొలగించు</button>' : ''}
                </div>

                <div style="margin-bottom: 10px;">
                    <label style="font-size: 12px; color: #475569; font-weight: bold;">పంట విభాగం (Category):</label>
                    <select class="p-category" required style="width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #cbd5e1; border-radius: 6px;">
                        <option value="fruits">Fruits (పండ్లు)</option>
                        <option value="vegetables">Vegetables (కూరగాయలు)</option>
                        <option value="grains">Grains (ధాన్యాలు)</option>
                        <option value="pulses">Pulses (పప్పుధాన్యాలు)</option>
                    </select>
                </div>

                <div style="margin-bottom: 10px;">
                    <label style="font-size: 12px; color: #475569; font-weight: bold;">పంట పేరు (Product Name):</label>
                    <input type="text" class="p-name" required placeholder="ఉదా: తాజా టమాటాలు" style="width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <label style="font-size: 12px; color: #475569; font-weight: bold;">పరిమాణం (Quantity):</label>
                        <input type="text" class="p-qty" required placeholder="ఉదా: 50 Kg" style="width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size: 12px; color: #475569; font-weight: bold;">రైతు ధర / కొనుగోలు ధర (₹):</label>
                        <input type="number" class="p-price" required placeholder="ఉదా: 30" style="width: 100%; padding: 8px; margin-top: 3px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
                    </div>
                </div>

                <div>
                    <label style="font-size: 12px; color: #475569; font-weight: bold;">📸 పంట ఫోటో (Photo):</label>
                    <div style="display: flex; gap: 8px; margin-top: 5px; align-items: center; flex-wrap: wrap;">
                        <button type="button" onclick="openWebcamModal(this)" style="background: #e0f2fe; color: #0369a1; border: 1px solid #0ea5e9; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">
                            💻 లైవ్ వెబ్‌క్యామ్
                        </button>
                        <input type="file" class="p-image" accept="image/*" required style="flex: 1; padding: 4px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; font-size: 11px;">
                    </div>
                </div>
            `;

            container.appendChild(rowDiv);
        }

        function openWebcamModal(btn) {
            activeImageInput = btn.parentElement.querySelector('.p-image');
            const modal = document.getElementById('webcam-modal');
            const video = document.getElementById('webcam-video');
            modal.style.display = 'flex';

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    videoStream = stream;
                    video.srcObject = stream;
                })
                .catch(err => {
                    alert("కెమెరా పర్మిషన్ లేదు లేదా అందుబాటులో లేదు!");
                    modal.style.display = 'none';
                });
        }

        function captureSnapshot() {
            const video = document.getElementById('webcam-video');
            const canvas = document.getElementById('webcam-canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const file = new File([blob], "farmer-capture.jpg", { type: "image/jpeg" });
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                
                if (activeImageInput) {
                    activeImageInput.files = dataTransfer.files;
                    alert("✅ ఫోటో విజయవంతంగా క్యాప్చర్ చేయబడింది!");
                }
                closeWebcamModal();
            }, 'image/jpeg');
        }

        function closeWebcamModal() {
            const modal = document.getElementById('webcam-modal');
            modal.style.display = 'none';
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
        }

        function submitFarmerData(event) {
            event.preventDefault();

            const farmerName = document.getElementById("farmer-name").value;
            const farmerPhone = document.getElementById("farmer-phone").value;
            const farmerLocation = document.getElementById("farmer-location").value;

            const productRows = document.querySelectorAll(".product-item-row");
            let pendingRequests = JSON.parse(localStorage.getItem('farmer_requests')) || [];
            let masterHistory = JSON.parse(localStorage.getItem('sasya_all_farmer_submissions')) || [];
            
            let processedCount = 0;

            productRows.forEach((row, index) => {
                const category = row.querySelector(".p-category").value;
                const name = row.querySelector(".p-name").value;
                const qty = row.querySelector(".p-qty").value;
                const price = row.querySelector(".p-price").value;
                const imageInput = row.querySelector(".p-image");

                if (imageInput.files && imageInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const uniqueId = Date.now() + index;
                        const productItem = {
                            id: uniqueId,
                            farmer: farmerName,
                            farmerName: farmerName,
                            phone: farmerPhone,
                            location: farmerLocation,
                            category: category,
                            name: name,
                            productName: name,
                            quantity: qty,
                            unit: qty,
                            price: Number(price),
                            image: e.target.result,
                            status: "Pending" // అడ్మిన్ అప్రూవల్ కోసం పెండింగ్ లో ఉంటుంది
                        };

                        pendingRequests.push(productItem);
                        masterHistory.push(productItem);

                        processedCount++;
                        if (processedCount === productRows.length) {
                            localStorage.setItem('farmer_requests', JSON.stringify(pendingRequests));
                            localStorage.setItem('sasya_all_farmer_submissions', JSON.stringify(masterHistory));

                            alert("🎉 మీ పంటల వివరాలు అడ్మిన్ పరిశీలన కోసం విజయవంతంగా పంపబడ్డాయి!");
                            document.getElementById("farmer-form").reset();
                            location.reload();
                        }
                    };
                    reader.readAsDataURL(imageInput.files[0]);
                }
            });
        }
    </script>
</body>
</html>
